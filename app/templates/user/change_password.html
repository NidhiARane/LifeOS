{% extends "base.html" %}

{% block title %}Change Password - LifeOS{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-key"></i> Change Password</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('user.change_password') }}" novalidate>
                        <!-- Current Password -->
                        <div class="mb-3">
                            <label for="old_password" class="form-label">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="old_password" name="old_password"
                                       placeholder="Enter your current password" required>
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="new_password" name="new_password"
                                       placeholder="Enter new password" required>
                            </div>
                            <small class="text-muted d-block mt-2">
                                <i class="fas fa-check-circle text-success"></i> At least 8 characters
                            </small>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                       placeholder="Confirm new password" required>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">
                            <i class="fas fa-save"></i> Update Password
                        </button>
                        <a href="{{ url_for('user.settings') }}" class="btn btn-secondary btn-lg w-100">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </form>
                </div>
            </div>

            <!-- Info Box -->
            <div class="alert alert-info mt-4">
                <i class="fas fa-lightbulb"></i>
                <strong>Password Tips:</strong>
                <ul class="mb-0 mt-2 small">
                    <li>Use a strong password with mixed characters</li>
                    <li>Don't reuse old passwords</li>
                    <li>Change your password periodically</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
