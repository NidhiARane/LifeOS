{% extends "base.html" %}

{% block title %}Add Grocery Item - LifeOS{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-plus-circle"></i> Add Grocery Item</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('grocery.add_item') }}" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="name" name="name"
                                   placeholder="e.g., Milk, Bread, Apples" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="quantity" name="quantity"
                                       placeholder="1" step="0.01" value="1" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="unit" class="form-label">Unit</label>
                                <input type="text" class="form-control" id="unit" name="unit"
                                       placeholder="kg, liter, pieces, etc." required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Unit Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="price" name="price"
                                       placeholder="0.00" step="0.01" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" name="category"
                                   placeholder="Vegetables, Dairy, Fruits, etc.">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Notes</label>
                            <textarea class="form-control" id="description" name="description"
                                      rows="3" placeholder="Add any notes about this item"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-check"></i> Add to Shopping List
                            </button>
                            <a href="{{ url_for('grocery.shopping_list') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
